<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js?64"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: system-ui, sans-serif;
            background: #111;
            color: #eee;
            line-height: 1.7;
        }
        h1 {
            font-size: 20px;
            margin: 0 0 8px;
        }
        p {
            color: #999;
            font-size: 14px;
            margin: 0 0 16px;
        }
        #data {
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 13px;
            direction: ltr;
            word-break: break-all;
        }
        #data.error {
            background: #2a1215;
            border-color: #e5484d;
            color: #ff8589;
            direction: rtl;
            font-family: inherit;
            font-size: 14px;
        }
        #parsed {
            margin-top: 12px;
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 4px 12px;
            font-family: monospace;
            font-size: 13px;
            direction: ltr;
        }
        #parsed:empty {
            display: none;
        }
        .row {
            padding: 8px 0;
            border-bottom: 1px solid #2a2a2a;
            word-break: break-all;
        }
        .row:last-child {
            border-bottom: 0;
        }
        .key {
            color: #6cb6ff;
        }
    </style>
</head>
<body>
    <h1>Telegram MiniApp initData</h1>
    <p>
        مقدار <code>initData</code> که تلگرام موقع باز شدن مینی‌اپ می‌فرسته
        اینجا نمایش داده می‌شه. سرور با این مقدار می‌تونه هویت کاربر رو تأیید کنه.
    </p>

    <h2>window.Telegram.WebApp.initData</h2>
    <div id="data"></div>
    <hr>
    <h2>Parsed</h2>
    <div id="parsed"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        const box = document.getElementById('data');

        if (tg.initData) {
            box.textContent = tg.initData;

            // initData یه query string هست؛ جدا جدا نشونش می‌دیم
            const parsed = document.getElementById('parsed');
            new URLSearchParams(tg.initData).forEach((value, key) => {
                const row = document.createElement('div');
                row.className = 'row';

                const k = document.createElement('span');
                k.className = 'key';
                k.textContent = key + ': ';

                const v = document.createElement('span');
                v.textContent = value;

                row.append(k, v);
                parsed.append(row);
            });
        } else {
            box.textContent = 'این اپ توی ربات باز نشده';
            box.classList.add('error');
        }
    </script>
</body>
</html>
